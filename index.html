/* ---------- salvar na nuvem ---------- */
function indic(st){const e=$('#nuvem');if(!e)return;e.dataset.st=st;e.title={ok:'Progresso salvo na nuvem',salvando:'Salvando na nuvem…',erro:'Sem conexão com a nuvem. O progresso está guardado neste navegador e será enviado quando voltar.'}[st]||'';}
function nuvemSalvar(forcar){
  if(!SB||ON.modo!=='online'||!ON.pid||ON.parado||(!ON.sujo&&!forcar))return Promise.resolve();
  if(ON.prom)return ON.prom.then(()=>nuvemSalvar(forcar));
  return ON.prom=(async()=>{
    ON.sujo=false;indic('salvando');
    try{const r=await SB.rpc('salvar_personagem',{pid:ON.pid,ses:ON.ses,dados:payload()});if(r.error)throw r.error;
      if(r.data===false){derrubado();return;}
      ON.falhas=0;indic('ok');}
    catch(e){ON.sujo=true;ON.falhas++;indic('erro');if(ON.falhas===3)toast('Sem conexão com a nuvem. Seu progresso está guardado neste navegador.');}
  })().finally(()=>{ON.prom=null;});
}
function derrubado(){ON.parado=true;indic('erro');try{localStorage.removeItem(KEY+':'+ON.pid);}catch(_){}openModal('derrubado');}
function nuvemFim(){   /* ao fechar a aba: melhor esforço (keepalive só aceita corpo pequeno) */
  if(ON.modo!=='online'||ON.parado||!ON.pid)return;
  try{const b=JSON.stringify({pid:ON.pid,ses:ON.ses,dados:payload()});
    if(b.length<60000&&ON.token)fetch(ONLINE.url+'/rest/v1/rpc/salvar_personagem',{method:'POST',keepalive:true,headers:{apikey:ONLINE.chave,Authorization:'Bearer '+ON.token,'Content-Type':'application/json'},body:b});
    else nuvemSalvar(true);}catch(e){}
}
function nuvemIniciar(){
  indic('ok');
  setInterval(()=>nuvemSalvar(),30000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)nuvemSalvar(true);});
  addEventListener('pagehide',nuvemFim);addEventListener('beforeunload',nuvemFim);
  addEventListener('online',()=>nuvemSalvar(true));
  if(ON.sujo)nuvemSalvar(true);
}
/* salva na nuvem e recarrega a página; no online reabre o mesmo personagem (auto) ou volta à lista */
async function recarregar(auto){
  if(ON.modo==='online'&&!ON.parado){save();try{await Promise.race([nuvemSalvar(true),new Promise(r=>setTimeout(r,5000))]);}catch(_){}
    if(auto&&ON.pid){try{sessionStorage.setItem(KEY+'_auto',ON.pid);}catch(_){}}}
  location.reload();
}
async function resetOnline(){
  if(!confirm(`Apagar o personagem ${S.name}? Não dá para desfazer.`))return;
  ON.parado=true;
  try{const r=await SB.from('personagens').delete().eq('id',ON.pid);if(r.error)throw r.error;}catch(e){ON.parado=false;toast(errPT(e));return;}
  try{localStorage.removeItem(KEY+':'+ON.pid);}catch(_){}
  location.reload();
}

function ptRec(t,m){try{PT.n.rec++;if(!PT.id||!m||typeof m!=='object'||typeof m.pid!=='string')return;const now=performance.now(),eu=PR.pid,de=m.pid.slice(0,64),mm=ptM(de);

    h+=ord.map(x=>{const lid=x.pid===PT.lider,eu=x.pid===PR.pid,pc=(v,m)=>Math.round(clamp(v/Math.max(1,m),0,1)*100);
      return `<div class="ptm"><div>${x.outfit?ret15(x.outfit):`<div class="ph">${esc((x.nome||'?')[0])}</div>`}</div><div class="pti"><div class="ptn">${ptEscSVG(lid?1:2,ex&&ex.flag||'off')}<b>${esc(x.nome)}</b>${eu?'<small>(você)</small>':''}</div>
        <div class="mut sm">${esc(VOC[x.voc].n)} · Level ${x.level}${HU&&x.loc!==HU.loc&&x.pid!==PR.pid&&HU.papel==='lider'&&!HU.lut.has(x.pid)?' · fora da caçada':''}</div>
        <div class="ptbar hp"><i style="width:${pc(x.hp,x.hpMax)}%"></i><span>${x.hp}/${x.hpMax}</span></div><div class="ptbar mp"><i style="width:${pc(x.mp,x.mpMax)}%"></i><span>${x.mp}/${x.mpMax}</span></div></div>
        ${sou&&!eu?`<div class="pta"><button data-act="ptKick" data-arg="${esc(x.pid)}">Expulsar</button>${HU?'':`<button data-act="ptLider" data-arg="${esc(x.pid)}">Passar líder</button>`}</div>`:''}</div>`;}).join('');
    h+=`<div class="ptx ${ex.flag}"><div>${ex.vocs.map(ptVocBadge).join('')}<b>${esc(ptBonusTxt(ex))}</b></div><div class="mut sm">Exp compartilhada: ${!PT.expOn?'<b>desligada</b>':ex.ativa?'<b style="color:#7fe07f">ativa</b>':ex.espera?'<b>aguardando</b>':'<b style="color:#ccc">inativa</b>'} — ${esc(ex.motivo)}</div></div>`;
    h+='<div class="ptb" style="margin-top:8px">'+(sou?`<button class="btn" data-act="ptExpTog">${PT.expOn?'Desligar':'Ligar'} exp compartilhada</button>`:'')+
      (!sou&&PT.huntInfo&&!HU&&S.loc==='city'?`<button class="btn go" data-act="ptIrCaca">Ir para a caçada (${esc(HUNTS[PT.huntInfo.loc].n)})</button>`:'')+`<button class="btn red" data-act="ptSair">Sair da party</button></div>`;}
  b.innerHTML=h;pintarRetratos();}
function ptAna(){const el=$('#anaParty');if(!el)return;const HU=PT.hunt;let h='';
  if(HU&&PT.mb.length>1){const an=HU.papel==='lider'?HU.an:HU.an,hd=`<div class="anap" style="border-top:0;color:var(--mut)"><span>PARTY</span><span>EXP/H</span><span>LUCRO/H</span></div>`;
    h=hd+PT.mb.map(x=>{const a=(an&&an[x.pid])||[0,0];return `<div class="anap"><b>${esc(x.nome)}</b><span>${a[0]?fmt(a[0]):'---'}</span><span class="${a[1]<0?'r':'g'}">${a[0]||a[1]?fmt(a[1]):'---'}</span></div>`;}).join('');}
  if(PT.sigA!==h){PT.sigA=h;el.innerHTML=h;}}
function ptUI(){try{const ex=PT.id?ptExp():null;PT.flag=ex?ex.flag:'off';ptRender();ptAna();}catch(e){}}
/* menu ao clicar num jogador da cidade */
function ptClique(e){if(!S||!W||!W.city||!PR.ativo||!W.cam)return;const r=prRemotoEm(e);if(!r)return;
  const noP=PT.id&&ptM(r.pid),cheia=PT.id&&PT.mb.length>=PT_MAX,naoLider=PT.id&&!ptSou();
  const dis=noP||cheia||naoLider,why=noP?'Já está na sua party':cheia?'Party cheia (4)':naoLider?'Só o líder convida':'';
  const c=$('#ctx');c.innerHTML=`<div class="ttl">${esc(r.nome)}</div><div class="info">${esc(VOC[r.voc].n)} · Level ${esc(r.level)}</div><button data-act="ptConvidar" data-arg="${esc(r.pid)}" ${dis?'disabled':''}>Convidar para party${why?' — '+why:''}</button>`;
  c.classList.remove('hidden');const b=c.getBoundingClientRect();c.style.left=clamp(e.clientX,4,innerWidth-b.width-4)+'px';c.style.top=clamp(e.clientY,4,innerHeight-b.height-4)+'px';e.stopPropagation();}
cv.addEventListener('click',ptClique);
const PTACT={ptConvidar:a=>{hideCtx();ptConvidar(a);},ptAceitar:a=>ptAceitar(+a),ptRecusar:a=>ptRecusar(+a),ptSair:()=>ptSair(),ptKick:a=>ptKick(a),ptLider:a=>ptPassar(a),ptExpTog:()=>ptExpTog(),
  ptHunt:a=>ptIniciarCacada(a),ptIrCaca:()=>ptIrCaca()};
/* ---- relógio da party (100 ms) ---- */
function ptTick(){try{if(!S)return;const now=performance.now(),ag=Date.now();
  PT.conv=PT.conv.filter(c=>c.ate>ag);for(const k in PT.sent)if(ag-PT.sent[k]>PT_CONVITE+10000)delete PT.sent[k];if(PT.pend&&PT.pend.ate<ag)PT.pend=null;
  if(PT.id){
    if(!PT.fake&&(!prModoRede()||PR.pid!==PT.me)){ptDesfazer('A party foi encerrada.');}
    else{
      if(!PT.tr&&!PT.fake)ptAbrir();
      const sou=ptSou(),HU=PT.hunt;
      if(!PT.conf&&!sou){if(PT.nEnt<6&&now-PT.tEnt>2500){PT.tEnt=now;PT.nEnt++;ptEnv('entrar',ptMetaEu());}else if(PT.nEnt>=6&&now-PT.tEnt>3500){ptDesfazer('Não foi possível entrar na party.');return;}}
      if(sou&&PT.mb.length<2&&!PT.fake&&!Object.keys(PT.sent).length){ptDesfazer('A party foi desfeita.');return;}
      const eu=ptM(PR.pid);if(eu&&now-PT.tMe>1000){PT.tMe=now;if(!HU||HU.papel!=='membro'||!HU.noJ)ptSan(ptMetaEu(),eu);eu.visto=now;}
      if(PT.conf&&now-PT.tSin>=5000){PT.tSin=now;if(sou)ptRost();else ptEnv('sinal',ptMetaEu());}
      if(PT.conf&&!PT.fake){
        if(sou){for(const x of PT.mb.slice())if(x.pid!==PR.pid&&now-x.visto>PT_SUMIR)ptTirar(x.pid,'caiu (sem sinal)');}
        else{const l=ptM(PT.lider);if(l&&now-l.visto>PT_SUMIR)ptTirar(PT.lider,'caiu (sem sinal)');}}
      if(PT.id&&HU){
        if(S.loc!==HU.loc){ptSairHunt(HU.papel==='lider'?'A caçada da party terminou (o líder saiu).':null,true);}
        else if(HU.papel==='lider'){
          ptFlush();
          for(const [pid,L] of [...HU.lut]){const x=ptM(pid);
            if(!x||(!PT.fake&&x.loc!==HU.loc&&now-(HU.tEnt[pid]||0)>8000)||(L.hp<=0&&L.morto&&W.time-L.tMorte>30000)){HU.lut.delete(pid);if(W.pl)W.pl.delete(L.y*W.w+L.x);W.aliados=(W.aliados||[]).filter(a=>a.dono!==L);}}}
        else{
          if(now>HU.visto+PT_SUMIR){ptSairHunt('O líder saiu da caçada.');}
          else if(!HU.noJ&&HU.nFic<8&&now-HU.tFic>3000)ptEnviarFicha();
          else if(HU.noJ&&HU.sigHot!==ptSigHot()&&now-HU.tFic>2000)ptEnviarFicha();}}}}
  ptUI();
}catch(e){}}
/* estado do líder: PARTY_HZ vezes por segundo */
function ptEstLoop(){try{const HU=PT.hunt;if(HU&&HU.papel==='lider'&&PT.id&&S&&S.loc===HU.loc){const now=performance.now();if(now-PT.tEst>=1000/PARTY_HZ-8){PT.tEst=now;ptEnviarEstado();}}}catch(e){}}
/* relógio da party num Worker: abas escondidas por muito tempo têm os timers da página reduzidos a 1 por minuto, e a party dependeria deles */
let ptWorker=null;
try{ptWorker=new Worker(URL.createObjectURL(new Blob(['let n=0;setInterval(()=>{n++;postMessage(n&1?1:2)},50)'],{type:'text/javascript'})));
  ptWorker.onmessage=e=>{ptEstLoop();if(e.data===2){ptTick();if(PT.hunt)tickLoop();}};}catch(e){ptWorker=null;}
if(!ptWorker){setInterval(ptTick,100);setInterval(ptEstLoop,50);}
addEventListener('pagehide',ptSairPagina);addEventListener('beforeunload',ptSairPagina);
/* teste local (só com ?rede=local): party falsa com lutadores simulados, sem rede. Ex.: ptTeste(['paladin','sorcerer','druid'],'edron_goblins') */
function ptTeste(vocs,hk){if(!REDE_LOCAL||!S||S.loc!=='city'||PT.hunt)return false;if(!PR.pid)PR.pid='Lteste'+Math.random().toString(36).slice(2,6);
  if(PT.id)ptDesfazer();
  PT.id=PT.me=PR.pid;PT.lider=PR.pid;PT.fake=true;PT.conf=true;PT.expOn=true;
  PT.mb=[Object.assign({pid:PR.pid,visto:performance.now()},ptSan(ptMetaEu()))];
  vocs.forEach((v,i)=>{const o=gerarOponente(S.level,1000,v);PT.mb.push(Object.assign({pid:'F'+i,visto:Infinity},ptSan({nome:o.nome,voc:v,level:o.nivel,outfit:o.outfit,hp:1,hpMax:1,mp:1,mpMax:1,loc:'city'}),{level:S.level}));});
  ptIniciarCacada(hk||S.lastHunt||bestHunt());return true;}

async function boot(){
  document.body.appendChild(holder);buildSprites();resize();
  if(CB)[...new Set([...Object.values(CB.efeitos),...Object.values(CB.tiros),CB.campo_fogo].map(e=>e.src))].forEach(folhaImg);
  ['Grass_Tile','Flowers_Grass_Tile','Cobbled_Pavement_Tile','Stone_(Floor)','Dirt_(Tile)','Cave_Floor_Earth','Rock_Soil','Fir_Tree','Tree','Bush','Mountain','Rock_Wall','Brick_Wall','Wall_(Sewers)','Sewer_Cover','Shallow_Water_Tile'].forEach(spr);
  Object.values(VOC).forEach(v=>spr(v.outfit));
  const modo=await entrada();
  if(modo==='offline')S=load();else document.body.classList.add('online');
  showLoading(true,'Carregando o mapa…');
  if(S){if(S.loc==='arena')S.loc='city';if(S.arena)S.arena.luta=null;
    if(!S.mig15){for(const set of Object.values(S.sets))for(const sl of set)if(sl&&sl.a==='exura_med_ico')sl.a='exura_gran_ico';S.mig15=1;}}
  try{await ensureRegion('city');if(S&&S.loc!=='city')await ensureRegion(S.loc).catch(()=>{S.loc='city';});}
  catch(e){showLoading(true,'Não foi possível carregar o mapa do Tibia. Verifique a internet e recarregue a página.');return;}
  showLoading(false);
  if(S){buildWorld(S.loc);setupWins();log('sys',`Bem-vindo de volta, ${S.name}!`,'y');presenteImbuements();}
  else openModal('create');
  setInterval(tickLoop,100);setInterval(hud,200);setInterval(save,10000);
  addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  if(modo==='online')nuvemIniciar();
  requestAnimationFrame(frame);tickLoop();
}
boot();
</script>
